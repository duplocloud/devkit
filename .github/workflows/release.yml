# Releases each agent in this repo on push to main, dev or rc, through duplocloud/actions/release-extension.
#
# For every extensions/<name>/ the action builds the bundle with scripts/build-all.sh, then signs it, cuts one GitHub
# Release per build tagged <name>-v<version>-sdk-<sdkVersion> at the built commit, uploads it, and registers it with
# the console as an unpublished version. The action's README has the rules: a build already released is resumed, not
# rebuilt, and an agent whose content changed at a version that already has a release fails the job, so bumping
# manifest.version is how you publish a new version to the agent library.
#
# main releases to the prod console and the prod bucket. In Duplo's own organizations, dev and rc release to the dev
# console and the non-prod bucket, with the release tagged <name>-dev-v<version>-sdk-<sdkVersion> (or -rc-) and marked a
# prerelease, so a dev build never takes the tag the main release of that version will use. The dev console has its own
# publisher keys, so the non-prod side reads CONSOLE_DEV_API_KEY, CONSOLE_DEV_SIGNING_KEY and CONSOLE_DEV_SIGNING_CERT,
# and uploads through a URL the dev console issues rather than the AWS role, which trusts main alone. Outside those
# organizations a push to dev or rc runs nothing here, since the console it would reach is Duplo's.
#
# This file ships with the dev-kit. After scripts/init-project.sh makes the repo yours, set these repo secrets
# (same as Agent CI): DUPLO_HOST + DUPLO_TOKEN, and CONSOLE_API_KEY, the console key the action registers versions
# with. Outside Duplo's organizations that key belongs to your console team, so set the repo variable CONSOLE_TEAM to
# the team's slug as well; the action then uses the team's own routes. By default the build fetches the host SDK feed
# from DUPLO_HOST, which must be reachable from CI (a public DuploCloud, not localhost), and releases the one bundle
# that host loads. With the repo variable DUPLO_SDK_VERSIONS set (comma-separated or one per line), the action builds one bundle
# per listed SDK version from the package feed and cuts one release per bundle, since a host loads only a bundle whose
# sdkVersion equals its own. This workflow still requires DUPLO_HOST and DUPLO_TOKEN either way: it forces
# DUPLO_TARGET=remote and checks both before the build. Turn on immutable releases in the repository's settings, too;
# the action warns on every release that lands mutable.
#
# In Duplo's own organizations (duplocloud, duplocloud-internal) the action also requires the signing key, the
# certificate, the ArmDot license and the release bot token, mapped below from the org secrets CONSOLE_SIGNING_KEY,
# ARMDOT_LICENSE_KEY and RELEASE_BOT_GITHUB_TOKEN and the org variable CONSOLE_SIGNING_CERT, and refuses a build that is
# unsigned or not obfuscated. The ArmDot build files are not in this repository: the action fetches them from the
# private duplocloud-internal/.github with the bot token before the build. There the upload goes
# through the AWS role assumed below, whose trust list in ai-release names the repositories that may publish. Outside
# those organizations nothing is obfuscated, nothing is signed unless the repository sets its own key and certificate,
# and the upload goes through a URL the console issues.
#
# The hot-load/deploy step is intentionally absent. We publish releases but do not auto-install onto the portal, so the
# install-from-registry flow stays testable end to end. Add a step running ./scripts/deploy-all.sh after the action to
# hot-load the built bundles on merge.

name: Agent Release

on:
  push:
    branches: [main, dev, rc]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish each version this run registers a first build for. A version that is already published is left alone.
        type: boolean
        default: false

permissions:
  contents: write        # create GitHub Releases
  id-token: write        # assume the agent-publisher role through GitHub OIDC

concurrency:
  # One release run per side at a time, never canceled between its writes.
  # One group per side, since a pending run waits behind one running run per group and the next push to the group
  # replaces it: a main release queued behind a dev release would be dropped by the next dev push. The two sides share
  # no console, bucket or tag, so they never need to wait on each other.
  group: extension-release-${{ github.repository }}-${{ github.ref == 'refs/heads/main' && 'prod' || 'nonprod' }}
  cancel-in-progress: false

jobs:
  release:
    # A dispatch from any other branch skips the job, so only main, dev and rc ever release, sign or publish, and dev and
    # rc only in Duplo's organizations, whose dev console they release to.
    if: >-
      github.ref == 'refs/heads/main' ||
      ((github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/rc') &&
       (github.repository_owner == 'duplocloud' || github.repository_owner == 'duplocloud-internal'))
    runs-on: ubuntu-latest
    env:
      DUPLO_TARGET: remote
      DUPLO_HOST: ${{ secrets.DUPLO_HOST }}
      DUPLO_TOKEN: ${{ secrets.DUPLO_TOKEN }}
      # main is the prod side. Anything else that reaches this job is dev or rc, the non-prod side.
      PROD: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Every tag and the history it points at: the action compares each released version's commit with this one
          # to tell an unchanged agent from one that changed without a version bump.
          fetch-depth: 0

      - name: Discover agents
        id: guard
        run: |
          # extension/manifest.json has no wildcard, so nullglob would keep it as a literal and the list would never
          # be empty. Count it only when the file exists.
          shopt -s nullglob
          dirs=(extensions/*/manifest.json extension/*/manifest.json)
          [ -f extension/manifest.json ] && dirs+=(extension/manifest.json)
          if [ ${#dirs[@]} -gt 0 ]; then echo "build=true" >> "$GITHUB_OUTPUT"
          else echo "build=false" >> "$GITHUB_OUTPUT"; echo "::notice::No extensions/*/manifest.json — nothing to release."; fi

      # Every secret and variable the run needs, checked by name before anything runs. Without this a missing
      # DUPLO_HOST surfaces as a build against devkit's local target, which does not exist on a runner, and a missing
      # role variable surfaces inside the credentials step. The values are only tested for emptiness.
      - name: Check the secrets and variables the release needs
        if: steps.guard.outputs.build == 'true'
        env:
          CONSOLE_API_KEY: ${{ secrets.CONSOLE_API_KEY }}
          CONSOLE_SIGNING_KEY: ${{ secrets.CONSOLE_SIGNING_KEY }}
          CONSOLE_SIGNING_CERT: ${{ vars.CONSOLE_SIGNING_CERT }}
          CONSOLE_DEV_API_KEY: ${{ secrets.CONSOLE_DEV_API_KEY }}
          CONSOLE_DEV_SIGNING_KEY: ${{ secrets.CONSOLE_DEV_SIGNING_KEY }}
          CONSOLE_DEV_SIGNING_CERT: ${{ vars.CONSOLE_DEV_SIGNING_CERT }}
          ARMDOT_LICENSE_KEY: ${{ secrets.ARMDOT_LICENSE_KEY }}
          RELEASE_BOT_GITHUB_TOKEN: ${{ secrets.RELEASE_BOT_GITHUB_TOKEN }}
          EXTENSION_PUBLISHER_ROLE_ARN: ${{ vars.EXTENSION_PUBLISHER_ROLE_ARN }}
          CONSOLE_TEAM: ${{ vars.CONSOLE_TEAM }}
        run: |
          missing=()
          for v in DUPLO_HOST DUPLO_TOKEN; do [ -n "${!v:-}" ] || missing+=("$v"); done
          if [ "$PROD" = true ]; then
            [ -n "${CONSOLE_API_KEY:-}" ] || missing+=(CONSOLE_API_KEY)
            case "$GITHUB_REPOSITORY_OWNER" in
              duplocloud|duplocloud-internal)
                for v in CONSOLE_SIGNING_KEY CONSOLE_SIGNING_CERT ARMDOT_LICENSE_KEY RELEASE_BOT_GITHUB_TOKEN EXTENSION_PUBLISHER_ROLE_ARN; do
                  [ -n "${!v:-}" ] || missing+=("$v")
                done ;;
              *) [ -n "${CONSOLE_TEAM:-}" ] || missing+=(CONSOLE_TEAM) ;;
            esac
          else
            # Only Duplo's organizations reach this side (see the job's if), and the dev console is theirs.
            for v in CONSOLE_DEV_API_KEY CONSOLE_DEV_SIGNING_KEY CONSOLE_DEV_SIGNING_CERT ARMDOT_LICENSE_KEY RELEASE_BOT_GITHUB_TOKEN; do
              [ -n "${!v:-}" ] || missing+=("$v")
            done
          fi
          [ ${#missing[@]} -eq 0 ] && exit 0
          echo "::error::This release needs ${missing[*]} set as repository or organization secrets and variables. The" \
            "DUPLO_* secrets name the host the build takes its SDK from, the console key registers the version (CONSOLE_API_KEY" \
            "on main, CONSOLE_DEV_API_KEY on dev and rc), CONSOLE_TEAM names the console team that key belongs to outside" \
            "DuploCloud's organizations, and in those organizations the signing and license values for that side, the release" \
            "bot token and, on main, the role variable are required. See docs/releasing-extensions.md."
          exit 1

      # Only Duplo's organizations hold the role, only the repositories its trust list names can assume it, and the trust
      # admits main alone, so a repository outside that list fails here, before anything is built, rather than at the
      # upload. dev and rc skip it and upload through a URL the dev console issues.
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        if: >-
          steps.guard.outputs.build == 'true' &&
          github.ref == 'refs/heads/main' &&
          (github.repository_owner == 'duplocloud' || github.repository_owner == 'duplocloud-internal') &&
          vars.EXTENSION_PUBLISHER_ROLE_ARN != ''
        with:
          role-to-assume: ${{ vars.EXTENSION_PUBLISHER_ROLE_ARN }}
          aws-region: us-west-2

      - uses: duplocloud/actions/release-extension@4fb35be22cb52767a6ac392db933fba8bc5bb138 # v1, pin moves to the tagged release once duplocloud/actions releases the channel input
        if: steps.guard.outputs.build == 'true'
        with:
          # Each side has its own console, keys and bucket. main is prod; dev and rc are the non-prod side.
          console-api-key: ${{ secrets[env.PROD == 'true' && 'CONSOLE_API_KEY' || 'CONSOLE_DEV_API_KEY'] }}
          console-url: ${{ env.PROD == 'true' && (vars.CONSOLE_URL || 'https://console.duplocloud.com') || (vars.CONSOLE_DEV_URL || 'https://dev-console.prod-apps.duplocloud.net') }}
          console-team: ${{ vars.CONSOLE_TEAM }}
          # Indexed by name rather than chosen with && ||, which falls through to the dev value when the prod one is unset.
          signing-key: ${{ secrets[env.PROD == 'true' && 'CONSOLE_SIGNING_KEY' || 'CONSOLE_DEV_SIGNING_KEY'] }}
          signing-cert: ${{ vars[env.PROD == 'true' && 'CONSOLE_SIGNING_CERT' || 'CONSOLE_DEV_SIGNING_CERT'] }}
          armdot-license: ${{ secrets.ARMDOT_LICENSE_KEY }}
          armdot-config-token: ${{ secrets.RELEASE_BOT_GITHUB_TOKEN }}
          # Read on main alone. On dev and rc the upload goes through the URL the dev console issues, so the bucket is
          # the console's to choose and this input is never read.
          bundle-bucket: ${{ vars.BUNDLE_BUCKET || 'duplo-helpdesk-channels' }}
          # A non-prod release gets its own tag family and is marked a prerelease. Empty on main.
          channel: ${{ github.ref == 'refs/heads/dev' && 'dev' || github.ref == 'refs/heads/rc' && 'rc' || '' }}
          # SDK versions to build against from the package feed, one per line, one bundle and one release per version.
          # The action exports them to the build as DUPLO_SDK_VERSIONS, so a job env of that name would be overwritten.
          # Empty builds one bundle from the host's SDK.
          sdk-versions: ${{ vars.DUPLO_SDK_VERSIONS }}
          publish: ${{ inputs.publish || false }}
