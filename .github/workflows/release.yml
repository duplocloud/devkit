# Releases each extension in this repo on push to main, through duplocloud/actions/release-extension.
#
# For every extensions/<name>/ the action builds the bundle with scripts/build-all.sh, then signs it, cuts one GitHub
# Release per build tagged <name>-v<version>-sdk-<sdkVersion> at the built commit, uploads it, and registers it with
# the console as an unpublished version. The action's README has the rules: a build already released is resumed, not
# rebuilt, and an extension whose content changed at a version that already has a release fails the job, so bumping
# manifest.version is how you publish a new version to the extension library.
#
# This file ships with the dev-kit. After scripts/init-project.sh makes the repo yours, set these repo secrets
# (same as Extension CI): DUPLO_HOST + DUPLO_TOKEN, since the build fetches the host SDK feed from DUPLO_HOST, which
# must be reachable from CI (a public DuploCloud, not localhost), and CONSOLE_API_KEY, the console key the action
# registers versions with. Outside Duplo's organizations that key belongs to your console team, so set the repo
# variable CONSOLE_TEAM to the team's slug as well; the action then uses the team's own routes. Turn on immutable
# releases in the repository's settings, too; the action warns on every release that lands mutable.
#
# In Duplo's own organizations (duplocloud, duplocloud-internal) the action also requires the signing key, the
# certificate and the ArmDot license, mapped below from the org secrets CONSOLE_SIGNING_KEY and ARMDOT_LICENSE_KEY and
# the org variable CONSOLE_SIGNING_CERT, and refuses a build that is unsigned or not obfuscated. There the upload goes
# through the AWS role assumed below, whose trust list in ai-release names the repositories that may publish. Outside
# those organizations nothing is obfuscated, nothing is signed unless the repository sets its own key and certificate,
# and the upload goes through a URL the console issues.
#
# The hot-load/deploy step is intentionally absent. We publish releases but do not auto-install onto the portal, so the
# install-from-registry flow stays testable end to end. Add a step running ./scripts/deploy-all.sh after the action to
# hot-load the built bundles on merge.

name: Extension Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish each version this run registers a first build for. A version that is already published is left alone.
        type: boolean
        default: false

permissions:
  contents: write        # create GitHub Releases
  id-token: write        # assume the extension-publisher role through GitHub OIDC

concurrency:
  # One release run per repository at a time, never canceled between its writes.
  group: extension-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    # A dispatch from any other branch skips the job, so only main's code ever releases, signs or publishes.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DUPLO_TARGET: remote
      DUPLO_HOST: ${{ secrets.DUPLO_HOST }}
      DUPLO_TOKEN: ${{ secrets.DUPLO_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Every tag and the history it points at: the action compares each released version's commit with this one
          # to tell an unchanged extension from one that changed without a version bump.
          fetch-depth: 0

      - name: Discover extensions
        id: guard
        run: |
          # extension/manifest.json has no wildcard, so nullglob would keep it as a literal and the list would never
          # be empty. Count it only when the file exists.
          shopt -s nullglob
          dirs=(extensions/*/manifest.json extension/*/manifest.json)
          [ -f extension/manifest.json ] && dirs+=(extension/manifest.json)
          if [ ${#dirs[@]} -gt 0 ]; then echo "build=true" >> "$GITHUB_OUTPUT"
          else echo "build=false" >> "$GITHUB_OUTPUT"; echo "::notice::No extensions/*/manifest.json — nothing to release."; fi

      # Every secret and variable the run needs, checked by name before anything runs. Without this a missing
      # DUPLO_HOST surfaces as a build against devkit's local target, which does not exist on a runner, and a missing
      # role variable surfaces inside the credentials step. The values are only tested for emptiness.
      - name: Check the secrets and variables the release needs
        if: steps.guard.outputs.build == 'true'
        env:
          CONSOLE_API_KEY: ${{ secrets.CONSOLE_API_KEY }}
          CONSOLE_SIGNING_KEY: ${{ secrets.CONSOLE_SIGNING_KEY }}
          CONSOLE_SIGNING_CERT: ${{ vars.CONSOLE_SIGNING_CERT }}
          ARMDOT_LICENSE_KEY: ${{ secrets.ARMDOT_LICENSE_KEY }}
          EXTENSION_PUBLISHER_ROLE_ARN: ${{ vars.EXTENSION_PUBLISHER_ROLE_ARN }}
          CONSOLE_TEAM: ${{ vars.CONSOLE_TEAM }}
        run: |
          missing=()
          for v in DUPLO_HOST DUPLO_TOKEN CONSOLE_API_KEY; do [ -n "${!v:-}" ] || missing+=("$v"); done
          case "$GITHUB_REPOSITORY_OWNER" in
            duplocloud|duplocloud-internal)
              for v in CONSOLE_SIGNING_KEY CONSOLE_SIGNING_CERT ARMDOT_LICENSE_KEY EXTENSION_PUBLISHER_ROLE_ARN; do
                [ -n "${!v:-}" ] || missing+=("$v")
              done ;;
            *) [ -n "${CONSOLE_TEAM:-}" ] || missing+=(CONSOLE_TEAM) ;;
          esac
          [ ${#missing[@]} -eq 0 ] && exit 0
          echo "::error::This release needs ${missing[*]} set as repository or organization secrets and variables. The" \
            "DUPLO_* secrets name the host the build takes its SDK from, CONSOLE_API_KEY registers the version, CONSOLE_TEAM" \
            "names the console team that key belongs to outside DuploCloud's organizations, and in those organizations the" \
            "signing, license and role values are required. See docs/releasing-extensions.md."
          exit 1

      # Only Duplo's organizations hold the role, and only the repositories its trust list names can assume it, so a
      # repository outside that list fails here, before anything is built, rather than at the upload.
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        if: >-
          steps.guard.outputs.build == 'true' &&
          (github.repository_owner == 'duplocloud' || github.repository_owner == 'duplocloud-internal') &&
          vars.EXTENSION_PUBLISHER_ROLE_ARN != ''
        with:
          role-to-assume: ${{ vars.EXTENSION_PUBLISHER_ROLE_ARN }}
          aws-region: us-west-2

      - uses: duplocloud/actions/release-extension@bc17a896897aa32a0d9c9997c1f5e56d76812cf1 # v1
        if: steps.guard.outputs.build == 'true'
        with:
          console-api-key: ${{ secrets.CONSOLE_API_KEY }}
          console-url: ${{ vars.CONSOLE_URL || 'https://console.duplocloud.com' }}
          console-team: ${{ vars.CONSOLE_TEAM }}
          signing-key: ${{ secrets.CONSOLE_SIGNING_KEY }}
          signing-cert: ${{ vars.CONSOLE_SIGNING_CERT }}
          armdot-license: ${{ secrets.ARMDOT_LICENSE_KEY }}
          bundle-bucket: ${{ vars.BUNDLE_BUCKET || 'duplo-helpdesk-channels' }}
          # SDK versions to build against from the package feed, one per line, one bundle and one release per version.
          # The action exports them to the build as DUPLO_SDK_VERSIONS, so a job env of that name would be overwritten.
          # Empty builds one bundle from the host's SDK.
          sdk-versions: ${{ vars.DUPLO_SDK_VERSIONS }}
          publish: ${{ inputs.publish || false }}
