<div class="card">
  <div class="card-body">
    <h4 class="font-weight-bolder">Hello World setup</h4>
    <p class="text-muted">Finish these steps once. They apply to every workspace.</p>

    <form name="SetupForm" #f="ngForm" class="form form-vertical" (ngSubmit)="f.valid && save()">
      <div class="form-container" form-group-errors showSummaryWhen="always" showDetailsWhen="submitted">
        <form-field>
          <div class="d-flex align-items-center justify-content-between">
            <label class="element-label">1. Connect a Hello World account *</label>
            <app-status-badge [status]="done() ? 'Complete' : 'Pending'" />
          </div>
          <duplo-connection-field
            category="other"
            [typeDefinition]="sampleType"
            name="scopeId"
            [(ngModel)]="scopeId"
            [disabled]="loading()"
            required>
          </duplo-connection-field>
        </form-field>

        @if (local()) {
          <p class="text-muted small mb-0">Saved in this browser only: the settings endpoint isn't available.</p>
        }

        <div class="d-flex justify-content-end mt-1">
          <button type="submit" class="btn btn-primary" [disabled]="f.invalid || loading() || saving()">Save</button>
        </div>
      </div>
    </form>
  </div>
</div>
